<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Task Manager</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>


<body class="bg-dark text-light">

    <div class="container min-vh-100 d-flex justify-content-center align-items-center">

        <div class="card bg-dark text-light border rounded-4 p-4 shadow"
             style="width: 100%; max-width: 450px;">

            <div class="text-center mb-4">

                <img
                    src="./logo.png"
                    alt="Logo"
                    width="70"
                    height="70"
                    class="mb-3"
                >

                <h1 class="h3">Create Account</h1>

                <p class="text-secondary">
                    Start managing your tasks today
                </p>

            </div>


            <!-- Name -->
            <div class="mb-3">

                <label for="signupName" class="form-label">
                    Full Name
                </label>

                <input
                    type="text"
                    id="signupName"
                    class="form-control bg-dark text-light border-secondary"
                    placeholder="Enter your name"
                >

            </div>


            <!-- Email -->
            <div class="mb-3">

                <label for="signupEmail" class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    id="signupEmail"
                    class="form-control bg-dark text-light border-secondary"
                    placeholder="Enter your email"
                >

            </div>


            <!-- Password -->
            <div class="mb-3">

                <label for="signupPass" class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    id="signupPass"
                    class="form-control bg-dark text-light border-secondary"
                    placeholder="Enter password"
                >

            </div>


            <!-- Signup Button -->
            <button
                onclick="Signup()"
                class="btn btn-primary w-100 py-2"
            >
                Sign Up
            </button>


            <p class="text-center mt-4 mb-0">

                Already have an account?

                <a href="login.html" class="text-info">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script src="./auth.js"></script>

</body>

</html>
