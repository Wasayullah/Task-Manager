<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Task Manager</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<style></style>
<style>



    body {
        background:
            radial-gradient(
                circle at top left,
                #312e81 0%,
                transparent 35%
            ),
            radial-gradient(
                circle at bottom right,
                #0e7490 0%,
                transparent 35%
            ),
            linear-gradient(
                135deg,
                #020617,
                #0f172a
            );

        min-height: 100vh;
        color: #f8fafc;
    }


    .card {
        background: rgba(15, 23, 42, 0.75) !important;

        border: 1px solid
            rgba(148, 163, 184, 0.2) !important;

        backdrop-filter: blur(12px);

        box-shadow:
            0 20px 50px
            rgba(0, 0, 0, 0.35) !important;
    }



    h1 {
        color: #f8fafc;
        font-weight: 600;
    }



    .form-label {
        color: #e2e8f0;
        font-weight: 500;
    }




    .form-control {
        background: rgba(30, 41, 59, 0.8) !important;

        color: #f8fafc !important;

        border: 1px solid
            #475569 !important;

        border-radius: 10px;

        padding: 12px 14px;

        transition: 0.3s ease;
    }



    .form-control:focus {
        background: rgba(30, 41, 59, 0.95) !important;

        color: #ffffff !important;

        border-color: #818cf8 !important;

        box-shadow:
            0 0 0 0.2rem
            rgba(99, 102, 241, 0.2) !important;
    }


    .form-control::placeholder {
        color: #94a3b8;
    }




    .btn-primary {
        background: linear-gradient(
            135deg,
            #6366f1,
            #4f46e5
        ) !important;

        border: none !important;

        border-radius: 10px;

        font-weight: 500;

        transition: 0.3s ease;
    }


    .btn-primary:hover {
        transform: translateY(-2px);

        box-shadow:
            0 8px 20px
            rgba(99, 102, 241, 0.35);
    }


    .btn-primary:active {
        transform: translateY(0);
    }




    a.text-info {
        color: #818cf8 !important;

        text-decoration: none;

        font-weight: 500;

        transition: 0.3s ease;
    }


    a.text-info:hover {
        color: #a5b4fc !important;

        text-decoration: underline;
    }




    .text-secondary {
        color: #94a3b8 !important;
    }




    img {
        object-fit: contain;
    }



    @media (max-width: 576px) {

        .card {
            margin: 15px;

            padding: 25px !important;
        }

        h1 {
            font-size: 1.5rem;
        }

    }
    .swal2-popup {
        background: rgba(15, 23, 42, 0.75) !important;
        border: 1px solid rgba(148, 163, 184, 0.2) !important;
        backdrop-filter: blur(12px);
    }
        .swal2-confirm {
        background-color: #082a79;
    }
    .swal2-confirm:hover{
        background-color: #031f61;
    }
    .swal2-title {
        color: white;
    }
    .swal2-html-container{
        color: white;
    }

</style>

<body class=" text-light">


    <div class="container min-vh-100 d-flex justify-content-center align-items-center">

        <div class="card  text-light border rounded-4 p-4 shadow"
             style="width: 100%; max-width: 450px;">


            <div class="text-center mb-4">

                <img
                    src="./logo.png"
                    alt="Logo"
                    width="70"
                    height="70"
                    class="mb-3"
                >

                <h1 class="h3">
                    Welcome Back
                </h1>

                <p class="text-secondary">
                    Login to manage your tasks
                </p>

            </div>


            <!-- Email -->
            <div class="mb-3">

                <label for="loginEmail" class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    class="form-control  text-light border-secondary"
                    placeholder="Enter your email"
                >

            </div>


            <!-- Password -->
            <div class="mb-3">

                <label for="loginPass" class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPass"
                    class="form-control  text-light border-secondary"
                    placeholder="Enter your password"
                >

            </div>


            <!-- Login Button -->
            <button
                onclick="Login()"
                class="btn btn-primary w-100 py-2"
            >
                Login
            </button>


            <p class="text-center mt-4 mb-0">

                Don't have an account?

                <a href="signup.html" class="text-info">
                    Sign Up
                </a>

            </p>

        </div>

    </div>


    <script src="./auth.js"></script>

</body>

</html>
