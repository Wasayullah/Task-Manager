<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Task Manager</title>
</head>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        background:
            radial-gradient(circle at top left, #312e81 0%, transparent 35%),
            radial-gradient(circle at bottom right, #0e7490 0%, transparent 35%),
            linear-gradient(135deg, #020617, #0f172a);
        min-height: 100vh !important;


        display: flex !important;
        flex-direction: column !important;
    }

    .card,
    .status .card,
    .adding-opts,
    .swal2-popup {
        background: rgba(15, 23, 42, 0.75) !important;
        border: 1px solid rgba(148, 163, 184, 0.2) !important;
        backdrop-filter: blur(12px);
    }


    .form-control {
        background: rgba(30, 41, 59, 0.8) !important;
        color: #f8fafc !important;
        border: 1px solid #475569 !important;
    }



    .form-control:focus {
        background: rgba(30, 41, 59, 0.95) !important;
        color: #ffffff !important;
        border-color: #818cf8 !important;
        box-shadow: 0 0 0 0.2rem rgba(99, 102, 241, 0.2) !important;
    }


    .form-control::placeholder {
        color: #94a3b8;
    }



    select {
        background-color: #1e293b !important;
        color: #f8fafc !important;
        border: 1px solid #475569 !important;
    }


    .list-group-item {
        background: rgba(15, 23, 42, 0.85) !important;
        color: #f8fafc !important;
        border: 1px solid rgba(148, 163, 184, 0.2) !important;
    }



    .list-group-item.bg-success {
        background: rgba(22, 163, 74, 0.75) !important;
    }


    .status .card {
        color: #f8fafc !important;
        text-align: center;
    }

    @media (max-width: 480px) {

        .status {
            display: flex !important;
            flex-direction: row !important;
            flex-wrap: nowrap !important;
            gap: 5px !important;
            padding: 0 5px;
        }

        .status .card {
            flex: 1 1 0;
            width: auto !important;
            min-width: 0;

            padding: 10px 3px !important;
            margin: 0 !important;

            text-align: center;
            font-size: 11px;
        }

        .status .card div {
            font-size: 18px;
            font-weight: bold;
        }
    }

    .btn-outline-light {
        border-color: #64748b;
        color: #e2e8f0;
    }

    .btn-outline-light:hover {
        background-color: #6366f1;
        border-color: #6366f1;
    }

    .main {
        height: 40vh;
    }

    .user {
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 12px;
        padding: 8px 14px;
    }

    .swal2-confirm {
        background-color: #082a79;
    }

    .swal2-confirm:hover {
        background-color: #031f61;
    }

    .swal2-cancel {
        background-color: #0e7490;
    }

    .swal2-cancel:hover {
        background-color: #03576e;
    }

    .swal2-title {
        color: white;
    }

    .swal2-input {
        background: rgba(30, 41, 59, 0.8) !important;
        color: #f8fafc !important;
        border: 1px solid #475569 !important;
    }

    .swal2-input:focus {
        background: rgba(30, 41, 59, 0.95) !important;
        color: #ffffff !important;
        border-color: #818cf8 !important;
        box-shadow: 0 0 0 0.2rem rgba(99, 102, 241, 0.2) !important;
    }

    .main {
        flex: 1;
    }

    .copyrights {
        width: 100%;
        margin-top: 40px;
        padding: 20px 15px;

        text-align: center;
        /* position: relative; */
        /* bottom: 0; */
        background: rgba(15, 23, 42, 0.65);

        border-top: 1px solid rgba(148, 163, 184, 0.2);

        backdrop-filter: blur(12px);

        color: #94a3b8;

        font-size: 14px;

        line-height: 1.8;

        box-shadow:
            0 -10px 30px rgba(0, 0, 0, 0.15);
    }




    .copyrights strong {
        color: #a5b4fc;
        font-weight: 600;
    }




    .copyrights i {
        color: #818cf8;
        margin-right: 5px;
    }




    .copyrights p {
        margin: 0;
    }



    @media (max-width: 576px) {

        .copyrights {
            padding: 18px 10px;
            font-size: 13px;
        }

    }
</style>

<body class="text-light">

    <div class="container-fluid container-lg">


        <div class="header d-flex flex-column flex-md-row justify-content-between align-items-center gap-3 p-3">

            <div class="heading d-flex align-items-center gap-3 text-center text-md-start">
                <img src="./logo.png" alt="logo" class="logo img-fluid" width="80" height="80">

                <div class="text">
                    <h1 class="h2 mb-1">M-549 <br>Task Manager</h1>
                    <small>Organize, Achieve, Advance</small>
                </div>
            </div>

            <div class="account d-flex align-items-center justify-content-center gap-2">
                <div id="User"
                    class="btn btn-outline-primary text-center d-flex align-items-center justify-content-center"></div>
                <button id="log" class="btn btn-outline-danger" onclick="Logout()">

                </button>
            </div>

        </div>
        <div id="searchField">

        </div>



        <div class="adding-opts border rounded-3 p-3 mx-2">

            <div class="row g-2">


                <div class="col-12 col-md">
                    <input type="text" name="input" id="input" placeholder="Enter task..."
                        class="form-control  text-light border-secondary">
                </div>


                <div class="col-12 col-sm-6 col-md-auto">
                    <select name="priority" class="form-select  text-light border-secondary">
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </div>


                <div class="col-12 col-sm-6 col-md-auto">
                    <button class="btn btn-outline-light w-100" onclick="addItem()">
                        Add Item
                    </button>
                </div>

            </div>

        </div>



        <div class="status row g-3 mt-1 px-2">

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card p-3 h-100  text-light border rounded-3">
                    <span>Total Tasks</span>
                    <strong id="total" class="fs-3">0</strong>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card p-3 h-100  text-light border rounded-3">
                    <span>Completed</span>
                    <strong id="completed" class="fs-3">0</strong>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card p-3 h-100  text-light border rounded-3">
                    <span>Pending</span>
                    <strong id="pending" class="fs-3">0</strong>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card p-3 h-100  text-light border rounded-3">
                    <span>High Priority</span>
                    <strong id="high" class="fs-3">0</strong>
                </div>
            </div>

        </div>



        <div class="main mt-4 px-2">

        </div>

    </div>
    <footer class="copyrights">

        <p>
            <i class="fas fa-code"></i>
            Developer
            <strong>Mohammad Wasayullah</strong>
            <br>
            &copy; 2026 All rights reserved
        </p>

    </footer>
    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
