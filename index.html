<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Task Manager</title>
</head>

<body class="bg-dark text-light">
    <div class="header d-flex justify-content-between align-items-center p-3">
        <div class="heading d-flex align-items-center gap-3">
            <img src="./logo.png" alt="logo" class="logo" width="50" height="50">
            <div class="text d-flex flex-column">
                <h1>Task Manager</h1>
                <small>Organize, Achieve, Advance</small>
            </div>

        </div>
        <div class="account">
            <button class="btn btn-outline-light">Login</button>
        </div>
    </div>
    <div class="adding-opts d-flex justify-content-around p-3 border rounded-3">
        <input type="text" name="input" id="input" class="form-control w-50 bg-dark text-light">
        <select name="priority" class="bg-dark text-light border rounded-3">
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
        </select>
        <div class="btn btn-outline-light">Add Item</div>

    </div>
    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
