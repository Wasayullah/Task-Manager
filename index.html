<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Task Manager</title>
</head>

<body class="bg-dark text-light">

    <div class="container-fluid container-lg">


        <div class="header d-flex flex-column flex-md-row justify-content-between align-items-center gap-3 p-3">

            <div class="heading d-flex align-items-center gap-3 text-center text-md-start">
                <img src="./logo.png" alt="logo" class="logo img-fluid" width="50" height="50">

                <div class="text">
                    <h1 class="h2 mb-1">Task Manager</h1>
                    <small>Organize, Achieve, Advance</small>
                </div>
            </div>

            <div class="account">
                <button class="btn btn-outline-light">
                    Login
                </button>
            </div>

        </div>



        <div class="adding-opts border rounded-3 p-3 mx-2">

            <div class="row g-2">


                <div class="col-12 col-md">
                    <input type="text" name="input" id="input" placeholder="Enter task..."
                        class="form-control bg-dark text-light border-secondary">
                </div>


                <div class="col-12 col-sm-6 col-md-auto">
                    <select name="priority" class="form-select bg-dark text-light border-secondary">
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </div>


                <div class="col-12 col-sm-6 col-md-auto">
                    <button class="btn btn-outline-light w-100" onclick="addItem()">
                        Add Item
                    </button>
                </div>

            </div>

        </div>



        <div class="status row g-3 mt-1 px-2">

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card p-3 h-100 bg-dark text-light border rounded-3">
                    <span>Total Tasks</span>
                    <strong id="total" class="fs-3">0</strong>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card p-3 h-100 bg-dark text-light border rounded-3">
                    <span>Completed</span>
                    <strong id="completed" class="fs-3">0</strong>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card p-3 h-100 bg-dark text-light border rounded-3">
                    <span>Pending</span>
                    <strong id="pending" class="fs-3">0</strong>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card p-3 h-100 bg-dark text-light border rounded-3">
                    <span>High Priority</span>
                    <strong id="high" class="fs-3">0</strong>
                </div>
            </div>

        </div>



        <div class="main mt-4 px-2" style="height: 60vh;">

        </div>

    </div>

    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
